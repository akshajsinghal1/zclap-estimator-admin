<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZCLAP Admin</title>
  <link rel="icon" type="image/png" href="/favicon.png?v=2" />
  <link rel="shortcut icon" href="/favicon.png?v=2" />
  <link rel="apple-touch-icon" href="/favicon.png?v=2" />
  <style>
    :root {
      --orange: #e8490f;
      --dark: #1a1a1a;
      --mid: #555555;
      --bg: #f7f6f2;
      --card: #ffffff;
      --border: #e0ded8;
      --green: #0f7a32;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --dark: #f3f4f6;
        --mid: #b7bdc7;
        --bg: #0f1216;
        --card: #171c22;
        --border: #2a3038;
        --green: #7fd9a1;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--dark); }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      height: 60px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      padding: 0;
      min-height: 0;
    }
    .brand img { display: block; height: 30px; width: auto; }
    .brand-text { color: var(--dark); font-size: 12px; font-weight: 700; letter-spacing: 0.03em; }
    .toolbar { display: flex; align-items: center; gap: 12px; color: var(--mid); font-size: 13px; }
    .btn {
      border: 1px solid #1a1a1a;
      background: #1a1a1a;
      color: #ffffff;
      height: 34px;
      padding: 0 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .btn:hover { opacity: 0.92; }
    .btn-approve { border: 0; background: var(--orange); color: #fff; height: 32px; padding: 0 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; }
    main { max-width: 1040px; margin: 24px auto; padding: 0 16px 30px; }
    h1 { margin: 0 0 8px; font-size: 26px; }
    .sub { color: var(--mid); margin-bottom: 20px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
    .tab { border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 8px 14px; font-size: 13px; cursor: pointer; color: var(--mid); }
    .tab.active { border-color: var(--orange); color: var(--orange); background: #fff4ef; }
    .list { display: grid; gap: 12px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
    .row { display: flex; flex-wrap: wrap; gap: 14px; margin: 6px 0; font-size: 13px; color: var(--mid); }
    .top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .status, .status-email { display: inline-block; border-radius: 999px; padding: 3px 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
    .status.pending { background: #fff3db; color: #8a5a00; }
    .status.done { background: #e8f7ed; color: var(--green); }
    .status-email.queued { background: #e9f2ff; color: #185fa5; }
    .status-email.not_sent { background: #fff3db; color: #8a5a00; }
    .status-email.sent { background: #e8f7ed; color: var(--green); }
    .status-email.undelivered { background: #fcebeb; color: #a32d2d; }
    .email-error {
      color: #a32d2d;
      font-size: 12px;
      margin-top: 2px;
    }
    .empty { color: var(--mid); font-size: 14px; background: var(--card); border: 1px dashed var(--border); border-radius: 12px; padding: 18px; }
    @media (prefers-color-scheme: dark) {
      .btn {
        border-color: #f3f4f6;
        background: #f3f4f6;
        color: #12161b;
      }
    }
    /* ── Review Modal ─────────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      display: flex; align-items: center; justify-content: center;
      z-index: 200; padding: 16px;
    }
    .modal-overlay.hidden { display: none; }
    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%; max-width: 900px;
      max-height: 92vh;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    }
    .modal-header h2 { margin: 0; font-size: 16px; }
    .modal-header .meta { font-size: 12px; color: var(--mid); margin-top: 3px; }
    .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--mid); line-height: 1; padding: 0; }
    .modal-body {
      display: flex; flex: 1; overflow: hidden; min-height: 0;
    }
    .modal-inputs {
      flex: 1; overflow-y: auto; padding: 20px 20px 20px 20px;
      border-right: 1px solid var(--border);
    }
    .modal-result {
      width: 230px; min-width: 230px; padding: 20px 16px;
      background: var(--bg);
      display: flex; flex-direction: column; gap: 0;
      overflow-y: auto;
    }
    .modal-footer {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      display: flex; justify-content: flex-end; gap: 10px; align-items: center;
    }
    .btn-cancel { background: none; border: 1px solid var(--border); color: var(--mid); height: 34px; padding: 0 14px; border-radius: 8px; cursor: pointer; font-size: 13px; }
    .btn-cancel:hover { border-color: var(--mid); }
    /* Input form */
    .rv-section { margin-bottom: 18px; }
    .rv-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--mid); margin-bottom: 8px; }
    .rv-checkboxes { display: flex; flex-wrap: wrap; gap: 6px; }
    .rv-check { display: flex; align-items: center; gap: 5px; font-size: 13px; cursor: pointer; }
    .rv-check input { cursor: pointer; }
    .rv-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 10px; }
    .rv-row label { font-size: 13px; color: var(--dark); flex: 1; }
    .rv-row input[type=number], .rv-row select {
      width: 100px; height: 32px; padding: 0 8px;
      border: 1px solid var(--border); border-radius: 6px;
      font-size: 13px; font-family: inherit; color: var(--dark); background: var(--card);
    }
    .rv-row select { width: 180px; }
    /* Result panel */
    .res-block { margin-bottom: 16px; }
    .res-eyebrow { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--mid); margin-bottom: 4px; }
    .res-value { font-size: 22px; font-weight: 700; color: var(--dark); line-height: 1.2; }
    .res-sub { font-size: 12px; color: var(--mid); margin-top: 2px; }
    .res-divider { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
    .res-final { background: var(--orange); border-radius: 8px; padding: 12px; margin-top: 4px; }
    .res-final .res-eyebrow { color: rgba(255,255,255,0.8); }
    .res-final .res-value { color: #fff; font-size: 20px; }
    .res-final .res-sub { color: rgba(255,255,255,0.75); }
    .contingency-input { display: flex; align-items: center; gap: 6px; }
    .contingency-input input { width: 64px; height: 32px; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; font-weight: 600; font-family: inherit; color: var(--dark); background: var(--card); }
    .contingency-input span { font-size: 14px; color: var(--mid); }
    @media (max-width: 640px) {
      .modal-body { flex-direction: column; }
      .modal-result { width: 100%; border-right: none; border-top: 1px solid var(--border); }
      .modal-inputs { border-right: none; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/" aria-label="ZCLAP Admin home">
      <img src="/logo.png" alt="ZCLAP" />
      <span class="brand-text">ADMIN</span>
    </a>
    <div class="toolbar">
      <span id="whoami">Checking session...</span>
      <button class="btn" id="logout-btn">Log out</button>
    </div>
  </header>

  <main>
    <h1>Estimator Requests</h1>
    <div class="sub">Pending and completed approval queue.</div>

    <div class="tabs">
      <button class="tab active" data-tab="pending">Pending</button>
      <button class="tab" data-tab="done">Done</button>
    </div>
    <div id="pending-list" class="list"></div>
    <div id="done-list" class="list" style="display:none"></div>
  </main>

  <!-- Review Modal -->
  <div class="modal-overlay hidden" id="review-overlay" onclick="handleOverlayClick(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div>
          <h2 id="rv-title">Review Request</h2>
          <div class="meta" id="rv-meta"></div>
        </div>
        <button class="modal-close" onclick="closeReview()" title="Close">×</button>
      </div>
      <div class="modal-body">
        <div class="modal-inputs" id="rv-inputs"></div>
        <div class="modal-result" id="rv-result"></div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeReview()">Cancel</button>
        <button class="btn-approve" id="rv-approve-btn" style="height:34px;padding:0 16px;font-size:13px;" onclick="submitReview()">Approve & Finalise →</button>
      </div>
    </div>
  </div>

  <script>
    let data = { pending: [], done: [] };
    const esc = (v) => String(v).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;");

    async function requireSession() {
      const res = await fetch("/api/admin/session");
      if (!res.ok) { window.location.href = "/admin/login"; return null; }
      const body = await res.json();
      document.getElementById("whoami").textContent = body.user.email;
      return body.user;
    }

    function requestCard(item) {
      const created = new Date(item.createdAt).toLocaleString();
      const approvedAt = item.approvedAt ? new Date(item.approvedAt).toLocaleString() : "-";
      const source = item.source || {};
      const user = item.user || {};
      const locationParts = [source.geo_city, source.geo_region, source.geo_country].filter(Boolean);
      const locationText = locationParts.length ? locationParts.join(", ") : "Unknown";
      const approveBtn = item.status === "pending"
        ? `<button class="btn-approve" style="background:var(--bg);color:var(--dark);border:1px solid var(--border);margin-right:6px" data-review-id="${esc(item.id)}">Review</button>`
        : `<span class="status done" style="margin-right:6px;font-weight:700;">Approved</span>`;
      const pdfBtn = `<button class="btn-approve" style="background:none;color:var(--mid);border:1px solid var(--border);margin-right:6px" data-pdf-id="${esc(item.id)}" title="Download PDF">⬇ PDF</button>`;
      const doneMeta = item.status === "done" ? `<div class="row"><span>Approved by: ${esc(item.approvedBy || "-")}</span><span>Approved at: ${esc(approvedAt)}</span></div>` : "";
      const emailStatus = item.emailStatus || "queued";
      const emailErrorMeta = (emailStatus === "undelivered" || emailStatus === "not_sent") && item.emailError
        ? `<div class="row"><span class="email-error">Email error: ${esc(item.emailError)}</span></div>`
        : "";
      return `<article class="card">
        <div class="top-row">
          <div><span class="status ${esc(item.status)}">${esc(item.status)}</span><strong style="margin-left:8px">${esc(item.id)}</strong></div>
          <div style="display:flex;align-items:center;">${approveBtn}${pdfBtn}</div>
        </div>
        <div class="row"><span><strong>${esc(user.firstName || "")} ${esc(user.lastName || "")}</strong></span><span>${esc(user.company || "-")}</span><span>${esc(user.email || "-")}</span></div>
        <div class="row"><span>Created: ${esc(created)}</span><span>Source: ${esc(source.utm_source || "direct")}</span><span>Email: <span class="status-email ${esc(emailStatus)}">${esc(emailStatus)}</span></span></div>
        <div class="row"><span>Location: ${esc(locationText)}</span><span>Timezone: ${esc(source.geo_timezone || "-")}</span></div>
        <div class="row"><span>${esc(item.estimateText || "-")}</span></div>
        ${emailErrorMeta}
        ${doneMeta}
      </article>`;
    }

    function renderList(id, items, emptyText) {
      const root = document.getElementById(id);
      root.innerHTML = items.length ? items.map(requestCard).join("") : `<div class="empty">${esc(emptyText)}</div>`;
    }

    async function loadRequests() {
      const res = await fetch("/api/admin/requests");
      if (!res.ok) {
        if (res.status === 401) { window.location.href = "/admin/login"; return; }
        throw new Error("Unable to load requests");
      }
      data = await res.json();
      renderList("pending-list", data.pending || [], "No pending requests.");
      renderList("done-list", data.done || [], "No completed requests.");
      bindApproveButtons();
      bindReviewButtons();
      bindPdfButtons();
    }

    function bindApproveButtons() {
      // kept for direct approve if ever needed
    }

    function bindReviewButtons() {
      [...document.querySelectorAll("[data-review-id]")].forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-review-id");
          const item = (data.pending || []).find(r => r.id === id);
          if (item) openReview(item);
        });
      });
    }

    function bindPdfButtons() {
      [...document.querySelectorAll("[data-pdf-id]")].forEach((btn) => {
        btn.addEventListener("click", async () => {
          const id = btn.getAttribute("data-pdf-id");
          const original = btn.textContent;
          btn.textContent = "Generating…";
          btn.disabled = true;
          try {
            const res = await fetch(`/api/admin/pdf?id=${encodeURIComponent(id)}`);
            if (!res.ok) throw new Error(await res.text());
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `ZCLAP-MDM-Estimate-${id}.pdf`;
            a.click();
            URL.revokeObjectURL(url);
          } catch (err) {
            alert("PDF generation failed: " + err.message);
          } finally {
            btn.textContent = original;
            btn.disabled = false;
          }
        });
      });
    }

    // ── Calc (mirrors estimator calc() exactly) ──────────────────
    function roundToStep(n, step) { return Math.round(Number(n || 0) / step) * step; }

    // ── Calculator version ──────────────────────────────────────────────────
    // v1.1 — synced with Lynn's May 2026 spreadsheets (2026-06-09)
    //   Fixed Bid MDM SaaS Estimator_MASTER_May2026.xlsx
    //   Fixed Bid MDM MIGRATION_Estimator_May26.xlsx
    // ───────────────────────────────────────────────────────────────────────
    const CALCULATOR_VERSION = "v1.1";

    function calcFromInputs(inp, estimatorType) {
      const ootbN = (inp.ootb || []).length;
      const custN = Number(inp.customEnt || 0);
      const totalEnt = ootbN + custN;
      const relN = Number(inp.rels || 0);
      const hierN = Number(inp.hierarchies || 0);
      const bOut = Number(inp.consumers || 0);
      const rtIn = Number(inp.rtSources || 0);
      const rtOut = Number(inp.rtConsumers || 0);
      const daas = Number(inp.daas || 0);
      const createWkfl = Number(inp.createWkfl || 0);
      const isModernization = estimatorType === 'modernization';

      const migMap = { 'Load by business ID': 1, 'Merge by old ID': 2, 'New match/merge': 3 };
      const migrationOption = migMap[inp.legacyHandling] || 3;

      const baseBatchIn = Number(inp.sources || 0);
      const bIn = isModernization && migrationOption === 1 ? baseBatchIn + 1 : baseBatchIn;
      const matchFactor = isModernization ? (migrationOption === 3 ? 1 : 2) : 1;

      const volMap = { 'Less than 1 million': 0, '1 million to 10 million': 1, '10 million to 80 million': 2, 'Over 80 million': 3 };
      const volScore = volMap[inp.volume] || 0;

      const entInHrs = totalEnt * bIn * 32;
      const relInHrs = relN * bIn * 6;
      const hierInHrs = hierN * bIn * 12;
      const entOutHrs = totalEnt * bOut * 24;
      const relOutHrs = relN * bOut * 4;
      const hierOutHrs = hierN * bOut * 12;
      const rtInHrs = rtIn * totalEnt * 24;
      const rtOutHrs = rtOut * totalEnt * 32;
      const circlebacks = (createWkfl > 0 ? 1 : 0) * totalEnt * 40;
      const searchBeforeCreate = createWkfl > 0 ? 40 : 0;
      const daasHrs = daas * 60;
      const profHrs = totalEnt * (bIn + rtIn) * 8;
      const custBuild = custN * 12;
      const ootbAdjust = ootbN * 8;
      const dqFuncHrs = totalEnt * 10 * 2;
      const matchHrs = totalEnt * matchFactor * 32;
      const layoutAndWorkflowHrs = (totalEnt * 1 * 6) + (totalEnt * 2 * 6) + (createWkfl * 10);

      // Excel Hour Totals sub-totals (mirrors spreadsheet structure)
      const cdiBaseHrs = entInHrs + relInHrs + hierInHrs + entOutHrs + relOutHrs + hierOutHrs + rtInHrs + rtOutHrs;
      const buildCDI   = cdiBaseHrs + circlebacks + searchBeforeCreate + (isModernization ? 0 : daasHrs);
      const buildMDM   = custBuild + ootbAdjust + matchHrs + layoutAndWorkflowHrs;
      const buildDQ    = profHrs + dqFuncHrs;
      const buildHrs   = buildCDI + buildMDM + buildDQ;

      // Developer counts — Excel's stepped IF formulas
      const cdiWks  = buildCDI / 40;
      const cdiDevs = cdiWks > 80 ? 8 : cdiWks > 60 ? 7 : cdiWks > 40 ? 5 : cdiWks > 15 ? 4 : cdiWks > 9 ? 3 : cdiWks > 2 ? 2 : 1;
      const mdmDevs = totalEnt > 4 ? 3 : totalEnt > 2 ? 2 : 1;

      // Build duration = max of CDI and MDM parallel tracks
      const buildWks = Math.ceil(Math.max(cdiWks / cdiDevs, (buildMDM / 40) / mdmDevs));

      // Phase durations — exact Excel formulas
      const reqWks    = Math.max(1, Math.min(5, Math.round(buildHrs * 0.15 / 120)));
      const designWks = Math.max(1, Math.min(5, Math.round(buildHrs * 0.15 / 120)));
      const integWks  = Math.max(isModernization ? 3 : 2, Math.round(0.35 * designWks));
      const uatWks    = Math.max(2, Math.min(isModernization ? 6 : 5, Math.round(buildHrs * 0.05 / 40)));
      const parallelWks = isModernization ? Math.max(2, Number(inp.parallelWeeks || 2)) : 0;
      const cutoverWks  = 1;

      // Schedule overlaps
      const buildDesignOverlap = (buildWks > 4 && designWks > 2) ? 1 : 0;
      const integBuildOverlap  = integWks > 3 ? (buildWks > 6 ? 2 : buildWks > 4 ? 1 : 0) : 0;

      // Total weeks
      const totalWks = Math.max(1, reqWks + designWks + buildWks + integWks + uatWks + parallelWks + cutoverWks - buildDesignOverlap - integBuildOverlap);

      // Per-role cost
      const intgArchHrsPW = bIn > 4 ? 15 : bIn > 2 ? 10 : 0;
      const rawCost = totalWks * (
          15 * 180
        + 20 * 195
        + 25 * 120
        + 10 * 60
        + 20 * mdmDevs * 60
        + intgArchHrsPW * 120
        + cdiDevs * 28 * 60
      );

      const low  = roundToStep(rawCost * 1.20, 5000);
      const high = roundToStep(rawCost * 1.30, 5000);

      let rs = 0;
      if (volScore >= 2) rs += 2; else if (volScore === 1) rs += 1;
      if (rtIn > 2 || rtOut > 2) rs += 2; else if (rtIn > 0 || rtOut > 0) rs += 1;
      if (totalEnt > 6) rs += 2; else if (totalEnt > 3) rs += 1;
      if (relN > 6) rs += 1;
      if (bIn + bOut > 8) rs += 1;
      if (isModernization) rs += 1;
      if (isModernization && migrationOption !== 3) rs += 1;
      const risk = rs <= 2 ? 'Low' : rs <= 5 ? 'Medium' : 'High';

      return {
        low, high, totalWks, risk,
        reqWks, designWks, buildWks, integWks, uatWks, parallelWks, cutoverWks,
        buildDesignOverlap, integBuildOverlap, mdmDevs, intgArchHrsPW, cdiDevs, rawCost,
        lowFmt: '$' + Math.round(low).toLocaleString('en-US'),
        highFmt: '$' + Math.round(high).toLocaleString('en-US')
      };
    }

    function calcFromScheduleAndRoles(sched, roles, contingencyPct, baseRisk) {
      const req = Number(sched.reqWks || 0);
      const des = Number(sched.designWks || 0);
      const bld = Number(sched.buildWks || 0);
      const itg = Number(sched.integWks || 0);
      const uat = Number(sched.uatWks || 0);
      const par = Number(sched.parallelWks || 0);
      const cut = Number(sched.cutoverWks || 1);

      const ovReq = Number(sched.reqOverlap || 0);
      const ovDes = Number(sched.designOverlap || 0);
      const ovBuildDes = Number(sched.buildDesignOverlap || 0);
      const ovItgBld = Number(sched.integBuildOverlap || 0);
      const ovUat = Number(sched.uatOverlap || 0);
      const ovPar = Number(sched.parallelOverlap || 0);
      const ovCut = Number(sched.cutoverOverlap || 0);

      const totalPhaseWks = req + des + bld + itg + uat + par + cut;
      const totalOverlaps = ovReq + ovDes + ovBuildDes + ovItgBld + ovUat + ovPar + ovCut;
      const netWks = Math.max(1, totalPhaseWks - totalOverlaps);

      // Role Weekly Rates & Hours
      const pmCost    = netWks * Number(roles.pmHrs || 0) * Number(roles.pmRate || 180);
      const advCost   = netWks * Number(roles.advisorHrs || 0) * Number(roles.advisorRate || 195);
      const saCost    = netWks * Number(roles.saHrs || 0) * Number(roles.saRate || 120);
      const cdqCost   = netWks * Number(roles.cdqHrs || 0) * Number(roles.cdqRate || 60);
      const mdmCost   = netWks * Number(roles.mdmDevs || 0) * 20 * Number(roles.mdmDevRate || 60);
      const intgCost  = netWks * Number(roles.intgArchHrs || 0) * Number(roles.intgArchRate || 120);
      const cdiCost   = netWks * Number(roles.cdiDevs || 0) * 28 * Number(roles.cdiDevRate || 60);

      const rawCost = pmCost + advCost + saCost + cdqCost + mdmCost + intgCost + cdiCost;

      const pct = Number(contingencyPct || 0);
      const low  = roundToStep(rawCost * (1 + pct / 100), 5000);
      const high = roundToStep(rawCost * (1 + pct / 100 + 0.083), 5000);

      return {
        totalPhaseWks,
        totalOverlaps,
        netWks,
        rawCost,
        low,
        high,
        lowFmt: '$' + Math.round(low).toLocaleString('en-US'),
        highFmt: '$' + Math.round(high).toLocaleString('en-US'),
        risk: baseRisk || 'Medium',
        costs: { pmCost, advCost, saCost, cdqCost, mdmCost, intgCost, cdiCost, rawCost }
      };
    }

    // ── Review state ──────────────────────────────────────────────
    let rv = { item: null, inp: {}, type: '', contingency: 20, schedule: {}, roles: {} };

    function openReview(item) {
      rv.item = item;
      rv.type = item.estimatorType || item.estimator_type || 'implementation';
      rv.inp = JSON.parse(JSON.stringify(item.inputs || {}));
      
      const baseCalc = calcFromInputs(rv.inp, rv.type);
      const prevRevOut = item.reviewed_outputs || {};
      const prevSched = prevRevOut.schedule || {};
      const prevRoles = prevRevOut.roles || {};

      rv.schedule = {
        reqWks: prevSched.reqWks ?? baseCalc.reqWks,
        reqOverlap: prevSched.reqOverlap ?? 0,
        designWks: prevSched.designWks ?? baseCalc.designWks,
        designOverlap: prevSched.designOverlap ?? 0,
        buildWks: prevSched.buildWks ?? baseCalc.buildWks,
        buildDesignOverlap: prevSched.buildDesignOverlap ?? baseCalc.buildDesignOverlap,
        integWks: prevSched.integWks ?? baseCalc.integWks,
        integBuildOverlap: prevSched.integBuildOverlap ?? baseCalc.integBuildOverlap,
        uatWks: prevSched.uatWks ?? baseCalc.uatWks,
        uatOverlap: prevSched.uatOverlap ?? 0,
        parallelWks: prevSched.parallelWks ?? baseCalc.parallelWks,
        parallelOverlap: prevSched.parallelOverlap ?? 0,
        cutoverWks: prevSched.cutoverWks ?? baseCalc.cutoverWks,
        cutoverOverlap: prevSched.cutoverOverlap ?? 0,
      };

      rv.roles = {
        pmHrs: prevRoles.pmHrs ?? 15,
        pmRate: prevRoles.pmRate ?? 180,
        advisorHrs: prevRoles.advisorHrs ?? 20,
        advisorRate: prevRoles.advisorRate ?? 195,
        saHrs: prevRoles.saHrs ?? 25,
        saRate: prevRoles.saRate ?? 120,
        cdqHrs: prevRoles.cdqHrs ?? 10,
        cdqRate: prevRoles.cdqRate ?? 60,
        mdmDevs: prevRoles.mdmDevs ?? baseCalc.mdmDevs,
        mdmDevRate: prevRoles.mdmDevRate ?? 60,
        intgArchHrs: prevRoles.intgArchHrs ?? baseCalc.intgArchHrsPW,
        intgArchRate: prevRoles.intgArchRate ?? 120,
        cdiDevs: prevRoles.cdiDevs ?? baseCalc.cdiDevs,
        cdiDevRate: prevRoles.cdiDevRate ?? 60,
      };

      rv.contingency = item.contingency_pct != null ? item.contingency_pct : 20;

      const user = item.user || {};
      const fn = item.firstName || item.first_name || user.firstName || '';
      const ln = item.lastName  || item.last_name  || user.lastName  || '';
      const co = item.company   || user.company   || '';
      document.getElementById('rv-title').textContent = `Review: ${fn} ${ln}`.trim() || 'Review Request';
      document.getElementById('rv-meta').textContent  = [co, item.id].filter(Boolean).join(' · ');

      renderReviewInputs();
      updateReviewResult();
      document.getElementById('review-overlay').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeReview() {
      document.getElementById('review-overlay').classList.add('hidden');
      document.body.style.overflow = '';
      rv = { item: null, inp: {}, type: '', contingency: 20, schedule: {}, roles: {} };
    }

    function handleOverlayClick(e) {
      if (e.target === document.getElementById('review-overlay')) closeReview();
    }

    function rvResetSchedule() {
      const baseCalc = calcFromInputs(rv.inp, rv.type);
      rv.schedule = {
        reqWks: baseCalc.reqWks,
        reqOverlap: 0,
        designWks: baseCalc.designWks,
        designOverlap: 0,
        buildWks: baseCalc.buildWks,
        buildDesignOverlap: baseCalc.buildDesignOverlap,
        integWks: baseCalc.integWks,
        integBuildOverlap: baseCalc.integBuildOverlap,
        uatWks: baseCalc.uatWks,
        uatOverlap: 0,
        parallelWks: baseCalc.parallelWks,
        parallelOverlap: 0,
        cutoverWks: baseCalc.cutoverWks,
        cutoverOverlap: 0,
      };
      renderReviewInputs();
      updateReviewResult();
    }

    function rvResetRoles() {
      const baseCalc = calcFromInputs(rv.inp, rv.type);
      rv.roles = {
        pmHrs: 15,
        pmRate: 180,
        advisorHrs: 20,
        advisorRate: 195,
        saHrs: 25,
        saRate: 120,
        cdqHrs: 10,
        cdqRate: 60,
        mdmDevs: baseCalc.mdmDevs,
        mdmDevRate: 60,
        intgArchHrs: baseCalc.intgArchHrsPW,
        intgArchRate: 120,
        cdiDevs: baseCalc.cdiDevs,
        cdiDevRate: 60,
      };
      renderReviewInputs();
      updateReviewResult();
    }

    function renderReviewInputs() {
      const isMod = rv.type === 'modernization';
      const inp = rv.inp;
      const sch = rv.schedule;
      const rls = rv.roles;
      const baseCalc = calcFromInputs(inp, rv.type);
      const res = calcFromScheduleAndRoles(sch, rls, rv.contingency, baseCalc.risk);
      const costs = res.costs;
      const fmtCost = n => '$' + Math.round(n || 0).toLocaleString('en-US');

      const ootbPills = (inp.ootb && inp.ootb.length)
        ? inp.ootb.map(o => `<span class="pill" style="display:inline-block;padding:2px 8px;background:#e2e8f0;border-radius:12px;font-size:8.5pt;margin:2px;">${o}</span>`).join('')
        : '<span style="color:#64748b;font-size:8.5pt;">None selected</span>';

      let h = '';

      // READ-ONLY CLIENT SCOPE DISPLAY
      h += `
        <div class="rv-section" style="background:#f8fafc;border:1px solid #cbd5e1;padding:12px 14px;border-radius:8px;margin-bottom:14px;">
          <div class="rv-label" style="color:#c9531f;font-weight:700;font-size:9pt;letter-spacing:0.04em;text-transform:uppercase;margin-bottom:8px;">
            🔒 Submitted Client Scope (Read-Only)
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:9pt;color:#334155;line-height:1.4;">
            <div><strong>Estimator Type:</strong> ${rv.type.toUpperCase()}</div>
            <div><strong>Record Volume:</strong> ${inp.volume || 'Not specified'}</div>
            <div style="grid-column:span 2;"><strong>OOTB Entities:</strong> ${ootbPills}</div>
            <div><strong>Custom Entities:</strong> ${inp.customEnt || 0}</div>
            <div><strong>Relationships / Hierarchies:</strong> ${inp.rels || 0} / ${inp.hierarchies || 0}</div>
            <div><strong>Batch Sources / RT Inbound:</strong> ${inp.sources || 0} / ${inp.rtSources || 0}</div>
            <div><strong>Batch Targets / RT Targets:</strong> ${inp.consumers || 0} / ${inp.rtConsumers || 0}</div>
            <div><strong>Create Workflows:</strong> ${inp.createWkfl || 0}</div>
            <div><strong>DaaS Services:</strong> ${inp.daas || 0}</div>
            ${isMod ? `<div style="grid-column:span 2;"><strong>Modernization Legacy Handling:</strong> ${inp.legacyHandling || 'New match/merge'} (${inp.parallelWeeks || 2} wks parallel)</div>` : ''}
          </div>
        </div>
      `;

      // INTERACTIVE SCHEDULE PHASE & OVERLAP TABLE (Matching Excel Sheet)
      h += `
        <div class="rv-section" style="border:1.5px solid #17324d;padding:12px 14px;border-radius:8px;margin-bottom:14px;background:#ffffff;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <div class="rv-label" style="color:#17324d;font-weight:700;font-size:9.5pt;margin:0;">
              📅 Schedule Phase &amp; Overlap Adjuster (Weeks)
            </div>
            <button type="button" onclick="rvResetSchedule()" style="background:#f1f5f9;border:1px solid #cbd5e1;border-radius:4px;padding:3px 8px;font-size:8pt;cursor:pointer;color:#334155;font-weight:600;">
              ↺ Reset Schedule
            </button>
          </div>

          <table style="width:100%;font-size:8.5pt;border-collapse:collapse;margin-bottom:4px;">
            <thead>
              <tr style="background:#f1f5f9;text-align:left;border-bottom:1px solid #cbd5e1;color:#17324d;">
                <th style="padding:5px 6px;">Phase Name</th>
                <th style="padding:5px 6px;text-align:center;">Duration (Wks)</th>
                <th style="padding:5px 6px;text-align:center;">Overlap (Wks)</th>
                <th style="padding:5px 6px;text-align:center;">Net Active Wks</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td style="padding:5px 6px;font-weight:500;">Discovery / Requirements</td>
                <td style="text-align:center;"><input type="number" min="1" max="12" value="${sch.reqWks}" oninput="rvSchedSet('reqWks',+this.value)" style="width:50px;text-align:center;"></td>
                <td style="text-align:center;"><input type="number" min="0" max="4" value="${sch.reqOverlap || 0}" oninput="rvSchedSet('reqOverlap',+this.value)" style="width:50px;text-align:center;"></td>
                <td style="text-align:center;font-weight:600;">${Math.max(0, sch.reqWks - (sch.reqOverlap || 0))}</td>
              </tr>
              <tr>
                <td style="padding:5px 6px;font-weight:500;">Architecture &amp; Design</td>
                <td style="text-align:center;"><input type="number" min="1" max="12" value="${sch.designWks}" oninput="rvSchedSet('designWks',+this.value)" style="width:50px;text-align:center;"></td>
                <td style="text-align:center;"><input type="number" min="0" max="4" value="${sch.designOverlap || 0}" oninput="rvSchedSet('designOverlap',+this.value)" style="width:50px;text-align:center;"></td>
                <td style="text-align:center;font-weight:600;">${Math.max(0, sch.designWks - (sch.designOverlap || 0))}</td>
              </tr>
              <tr>
                <td style="padding:5px 6px;font-weight:500;">Build &amp; Unit Test</td>
                <td style="text-align:center;"><input type="number" min="1" max="30" value="${sch.buildWks}" oninput="rvSchedSet('buildWks',+this.value)" style="width:50px;text-align:center;"></td>
                <td style="text-align:center;"><input type="number" min="0" max="4" value="${sch.buildDesignOverlap}" oninput="rvSchedSet('buildDesignOverlap',+this.value)" style="width:50px;text-align:center;"></td>
                <td style="text-align:center;font-weight:600;">${Math.max(0, sch.buildWks - sch.buildDesignOverlap)}</td>
              </tr>
              <tr>
                <td style="padding:5px 6px;font-weight:500;">Integration Testing</td>
                <td style="text-align:center;"><input type="number" min="1" max="12" value="${sch.integWks}" oninput="rvSchedSet('integWks',+this.value)" style="width:50px;text-align:center;"></td>
                <td style="text-align:center;"><input type="number" min="0" max="4" value="${sch.integBuildOverlap}" oninput="rvSchedSet('integBuildOverlap',+this.value)" style="width:50px;text-align:center;"></td>
                <td style="text-align:center;font-weight:600;">${Math.max(0, sch.integWks - sch.integBuildOverlap)}</td>
              </tr>
              <tr>
                <td style="padding:5px 6px;font-weight:500;">UAT Testing</td>
                <td style="text-align:center;"><input type="number" min="1" max="12" value="${sch.uatWks}" oninput="rvSchedSet('uatWks',+this.value)" style="width:50px;text-align:center;"></td>
                <td style="text-align:center;"><input type="number" min="0" max="4" value="${sch.uatOverlap || 0}" oninput="rvSchedSet('uatOverlap',+this.value)" style="width:50px;text-align:center;"></td>
                <td style="text-align:center;font-weight:600;">${Math.max(0, sch.uatWks - (sch.uatOverlap || 0))}</td>
              </tr>
              ${isMod ? `
              <tr>
                <td style="padding:5px 6px;font-weight:500;">Parallel Testing</td>
                <td style="text-align:center;"><input type="number" min="0" max="16" value="${sch.parallelWks}" oninput="rvSchedSet('parallelWks',+this.value)" style="width:50px;text-align:center;"></td>
                <td style="text-align:center;"><input type="number" min="0" max="4" value="${sch.parallelOverlap || 0}" oninput="rvSchedSet('parallelOverlap',+this.value)" style="width:50px;text-align:center;"></td>
                <td style="text-align:center;font-weight:600;">${Math.max(0, sch.parallelWks - (sch.parallelOverlap || 0))}</td>
              </tr>` : ''}
              <tr>
                <td style="padding:5px 6px;font-weight:500;">Cutover &amp; Training</td>
                <td style="text-align:center;"><input type="number" min="1" max="6" value="${sch.cutoverWks}" oninput="rvSchedSet('cutoverWks',+this.value)" style="width:50px;text-align:center;"></td>
                <td style="text-align:center;"><input type="number" min="0" max="4" value="${sch.cutoverOverlap || 0}" oninput="rvSchedSet('cutoverOverlap',+this.value)" style="width:50px;text-align:center;"></td>
                <td style="text-align:center;font-weight:600;">${Math.max(0, sch.cutoverWks - (sch.cutoverOverlap || 0))}</td>
              </tr>
            </tbody>
            <tfoot>
              <tr style="border-top:1.5px solid #cbd5e1;background:#f8fafc;font-weight:700;">
                <td style="padding:6px;">Net Delivery Timeline</td>
                <td style="padding:6px;text-align:center;">${res.totalPhaseWks} wks</td>
                <td style="padding:6px;text-align:center;color:#e4622a;">-${res.totalOverlaps} wks</td>
                <td style="padding:6px;text-align:center;color:#c9531f;">${res.netWks} wks</td>
              </tr>
            </tfoot>
          </table>
        </div>
      `;

      // INTERACTIVE ROLE ALLOCATION & EDITABLE RATES MATRIX (Excel AL14:AO26)
      h += `
        <div class="rv-section" style="border:1.5px solid #17324d;padding:12px 14px;border-radius:8px;background:#ffffff;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <div class="rv-label" style="color:#17324d;font-weight:700;font-size:9.5pt;margin:0;">
              👥 Role Allocations &amp; Resource Rates
            </div>
            <button type="button" onclick="rvResetRoles()" style="background:#f1f5f9;border:1px solid #cbd5e1;border-radius:4px;padding:3px 8px;font-size:8pt;cursor:pointer;color:#334155;font-weight:600;">
              ↺ Reset Roles &amp; Rates
            </button>
          </div>

          <table style="width:100%;font-size:8.5pt;border-collapse:collapse;" class="rv-role-table">
            <thead>
              <tr style="background:#f1f5f9;text-align:left;border-bottom:1px solid #cbd5e1;color:#17324d;">
                <th style="padding:5px 6px;">Role Name</th>
                <th style="padding:5px 6px;">Weekly Hrs / Count</th>
                <th style="padding:5px 6px;">Rate ($/hr)</th>
                <th style="padding:5px 6px;text-align:right;">Subtotal Cost</th>
              </tr>
            </thead>
            <tbody>
              <tr><td style="padding:5px 6px;font-weight:500;">Project Manager</td><td><input type="number" min="0" max="40" value="${rls.pmHrs}" oninput="rvRoleSet('pmHrs',+this.value)" style="width:50px;"> hrs/wk</td><td>$<input type="number" min="0" max="500" value="${rls.pmRate}" oninput="rvRoleSet('pmRate',+this.value)" style="width:55px;"></td><td style="text-align:right;font-weight:600;">${fmtCost(costs.pmCost)}</td></tr>
              <tr><td style="padding:5px 6px;font-weight:500;">MDM Advisor</td><td><input type="number" min="0" max="40" value="${rls.advisorHrs}" oninput="rvRoleSet('advisorHrs',+this.value)" style="width:50px;"> hrs/wk</td><td>$<input type="number" min="0" max="500" value="${rls.advisorRate}" oninput="rvRoleSet('advisorRate',+this.value)" style="width:55px;"></td><td style="text-align:right;font-weight:600;">${fmtCost(costs.advCost)}</td></tr>
              <tr><td style="padding:5px 6px;font-weight:500;">Solution Architect</td><td><input type="number" min="0" max="40" value="${rls.saHrs}" oninput="rvRoleSet('saHrs',+this.value)" style="width:50px;"> hrs/wk</td><td>$<input type="number" min="0" max="500" value="${rls.saRate}" oninput="rvRoleSet('saRate',+this.value)" style="width:55px;"></td><td style="text-align:right;font-weight:600;">${fmtCost(costs.saCost)}</td></tr>
              <tr><td style="padding:5px 6px;font-weight:500;">CDQ Specialist</td><td><input type="number" min="0" max="40" value="${rls.cdqHrs}" oninput="rvRoleSet('cdqHrs',+this.value)" style="width:50px;"> hrs/wk</td><td>$<input type="number" min="0" max="500" value="${rls.cdqRate}" oninput="rvRoleSet('cdqRate',+this.value)" style="width:55px;"></td><td style="text-align:right;font-weight:600;">${fmtCost(costs.cdqCost)}</td></tr>
              <tr><td style="padding:5px 6px;font-weight:500;">MDM Developers</td><td><input type="number" min="1" max="8" value="${rls.mdmDevs}" oninput="rvRoleSet('mdmDevs',+this.value)" style="width:50px;"> dev(s)</td><td>$<input type="number" min="0" max="500" value="${rls.mdmDevRate}" oninput="rvRoleSet('mdmDevRate',+this.value)" style="width:55px;"> (20h/ea)</td><td style="text-align:right;font-weight:600;">${fmtCost(costs.mdmCost)}</td></tr>
              <tr><td style="padding:5px 6px;font-weight:500;">Integration Architect</td><td><input type="number" min="0" max="40" value="${rls.intgArchHrs}" oninput="rvRoleSet('intgArchHrs',+this.value)" style="width:50px;"> hrs/wk</td><td>$<input type="number" min="0" max="500" value="${rls.intgArchRate}" oninput="rvRoleSet('intgArchRate',+this.value)" style="width:55px;"></td><td style="text-align:right;font-weight:600;">${fmtCost(costs.intgCost)}</td></tr>
              <tr><td style="padding:5px 6px;font-weight:500;">CDI / CAI Developers</td><td><input type="number" min="1" max="8" value="${rls.cdiDevs}" oninput="rvRoleSet('cdiDevs',+this.value)" style="width:50px;"> dev(s)</td><td>$<input type="number" min="0" max="500" value="${rls.cdiDevRate}" oninput="rvRoleSet('cdiDevRate',+this.value)" style="width:55px;"> (28h/ea)</td><td style="text-align:right;font-weight:600;">${fmtCost(costs.cdiCost)}</td></tr>
            </tbody>
            <tfoot>
              <tr style="border-top:1.5px solid #cbd5e1;background:#f8fafc;font-weight:700;">
                <td colspan="3" style="padding:6px;">Total T&amp;M Base Labor Cost</td>
                <td style="padding:6px;text-align:right;color:#17324d;">${fmtCost(costs.rawCost)}</td>
              </tr>
            </tfoot>
          </table>
        </div>
      `;

      document.getElementById('rv-inputs').innerHTML = h;
    }

    function rvSchedSet(key, val) {
      rv.schedule[key] = val;
      updateReviewResult();
    }

    function rvRoleSet(key, val) {
      rv.roles[key] = val;
      updateReviewResult();
    }

    function updateReviewResult() {
      const baseCalc = calcFromInputs(rv.inp, rv.type);
      const pct = Number(document.getElementById('rv-contingency')?.value ?? rv.contingency) || 0;
      rv.contingency = pct;

      const res = calcFromScheduleAndRoles(rv.schedule, rv.roles, pct, baseCalc.risk);
      const fmtK = n => '$' + Math.round(n).toLocaleString('en-US');

      document.getElementById('rv-result').innerHTML = `
        <div class="res-block">
          <div class="res-eyebrow">Adjusted T&amp;M Base</div>
          <div class="res-value">${fmtK(res.rawCost)}</div>
          <div class="res-sub">${res.netWks} net wks · ${res.risk} complexity</div>
        </div>
        <hr class="res-divider">
        <div class="res-block">
          <div class="res-eyebrow">Fixed Price Contingency</div>
          <div class="contingency-input">
            <input type="number" id="rv-contingency" min="0" max="100" value="${pct}" oninput="updateReviewResult()">
            <span>%</span>
          </div>
        </div>
        <hr class="res-divider">
        <div class="res-final">
          <div class="res-eyebrow">Final Quoted Price</div>
          <div class="res-value">${fmtK(res.low)} – ${fmtK(res.high)}</div>
          <div class="res-sub">${res.netWks} wks estimated</div>
        </div>`;
    }

    async function submitReview() {
      if (!rv.item) return;
      const targetItem = rv.item;

      const baseCalc = calcFromInputs(rv.inp, rv.type);
      const pct = rv.contingency || 0;
      const res = calcFromScheduleAndRoles(rv.schedule, rv.roles, pct, baseCalc.risk);
      const finalLow  = res.low;
      const finalHigh = res.high;

      // Update local item status immediately
      targetItem.status = "done";
      targetItem.approvedBy = "Admin";
      targetItem.approvedAt = new Date().toISOString();
      targetItem.estimateText = `$${finalLow.toLocaleString('en-US')} - $${finalHigh.toLocaleString('en-US')} | ${res.netWks} weeks | ${res.risk} complexity`;

      // Move item from pending to done list locally
      data.pending = (data.pending || []).filter(item => item.id !== targetItem.id);
      data.done = [targetItem, ...(data.done || [])];

      renderList("pending-list", data.pending || [], "No pending requests.");
      renderList("done-list", data.done || [], "No completed requests.");
      bindReviewButtons();
      bindPdfButtons();

      closeReview();

      fetch('/api/admin/approve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          requestId:       targetItem.id,
          reviewedInputs:  rv.inp,
          reviewedOutputs: {
            ...baseCalc,
            low: finalLow,
            high: finalHigh,
            totalWks: res.netWks,
            risk: res.risk,
            schedule: rv.schedule,
            roles: rv.roles,
          },
          contingencyPct:  pct,
          finalLow,
          finalHigh,
        }),
      })
      .then(() => loadRequests())
      .catch((err) => {
        console.error("Background approval error:", err);
        loadRequests();
      });
    }

    function bindTabs() {
      const tabs = [...document.querySelectorAll(".tab")];
      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          tabs.forEach((t) => t.classList.remove("active"));
          tab.classList.add("active");
          const isPending = tab.dataset.tab === "pending";
          document.getElementById("pending-list").style.display = isPending ? "grid" : "none";
          document.getElementById("done-list").style.display = isPending ? "none" : "grid";
        });
      });
    }

    async function logout() {
      await fetch("/api/admin/logout", { method: "POST" });
      window.location.href = "/admin/login";
    }

    async function init() {
      bindTabs();
      document.getElementById("logout-btn").addEventListener("click", logout);
      const user = await requireSession();
      if (!user) return;
      await loadRequests();
    }

    init().catch(() => {
      document.getElementById("pending-list").innerHTML = '<div class="empty">Error loading admin data. Refresh and try again.</div>';
    });
  </script>
</body>
</html>
